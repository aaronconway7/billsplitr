<main>
<div class="head">
<h1>Bill<span>Splitr</span></h1>
<select id="cur" aria-label="Currency"></select></div>
<p class="sub">Add the bill, tap who had what, see who owes what. No sign-up.</p>

<div class="card"><h2>1 · Who's splitting?</h2>
<div class="row" id="add-prow"><input id="pn" placeholder="Add a name" maxlength="20" autocomplete="off"><button class="p" id="addP">Add</button></div>
<div class="chips" id="people"></div></div>

<div class="card"><h2>2 · Items</h2>
<div class="row" id="add-irow"><input id="in" placeholder="Item (e.g. Margherita)" maxlength="40" autocomplete="off"><input id="ia" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Amount" style="max-width:96px"><button class="p" id="addI">Add</button></div>
<div id="items" style="margin-top:6px"></div></div>

<div class="card"><h2>3 · Service &amp; tip</h2>
<div class="seg" id="sc"></div>
<p class="mute" style="margin:8px 0 0">Shared in proportion to what each person ordered. Check whether service is already on the bill.</p></div>

<div class="card"><h2>Who owes what</h2>
<div id="res"></div>
<div style="margin-top:12px" class="mute">Who paid the bill? <span class="seg" id="payer" style="margin-top:6px"></span></div></div>

<div class="card"><h2>Share</h2>
<label class="tog" id="tog"><input type="checkbox" id="canedit" autocomplete="off"> Allow editing</label>
<div class="share"><button class="p" id="cp">Copy link</button><button id="wa">Copy for WhatsApp</button></div>
<p class="mute" id="shelp" style="margin:10px 0 0"></p>
<p class="mute" id="sv" style="margin:4px 0 0" aria-live="polite"></p>
<button id="reset" style="margin-top:10px">Start a new bill</button></div>
</main>
<footer>Created by <a href="https://aaronconway.co.uk" target="_blank" rel="noopener noreferrer">Aaron</a> 🍔</footer>

 $('pn').disabled=RO;$('addP').disabled=RO;$('in').disabled=RO;$('ia').disabled=RO;$('addI').disabled=RO;$('cur').disabled=RO;
